  <path d="M52 16 v-4 h-4" fill="none" stroke="#ffc94d" stroke-width="2" stroke-linecap="round"/>
  <path d="M12 48 v4 h4" fill="none" stroke="#ffc94d" stroke-width="2" stroke-linecap="round"/>
  <path d="M52 48 v4 h-4" fill="none" stroke="#ffc94d" stroke-width="2" stroke-linecap="round"/>

  <!-- portrait: head + shoulders silhouette -->
  <circle cx="32" cy="27" r="6.2" fill="#00e5b0"/>
  <path d="M20.5 47c0-7.2 5.1-12 11.5-12s11.5 4.8 11.5 12" fill="#00e5b0"/>
