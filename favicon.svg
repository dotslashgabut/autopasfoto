  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0d0f14"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#00e5b0" stroke-width="2"/>

  <!-- photo card -->
